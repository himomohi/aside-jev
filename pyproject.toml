[project]
name = "aside-jev"
version = "0.2.0"
description = "Bounded TypeSafe Jev decisions for Aside browser agents — pick one app-owned action ID, never invent clicks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Appcaster" }]
keywords = ["aside", "typesafe", "jev", "mcp", "browser-agent", "computer-use"]
dependencies = [
  "mcp>=1.0,<2",
  "httpx>=0.27",
  "typesafe-sdk>=0.6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aside-jev = "aside_jev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aside_jev"]

[tool.hatch.build.targets.wheel.force-include]
"extension" = "aside_jev/extension_assets"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Gate correctness first, without reformatting unrelated source and fixtures.
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
# Start with the pure validation boundary; expand as other modules are typed.
include = ["src/aside_jev/core.py", "src/aside_jev/browser_policy.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.sdist]
# 개발 도구의 중첩 캐시·브라우저 바이너리가 배포본에 섞이지 않도록 범위를 고정한다.
include = [
  "/src", "/extension", "/scripts", "/tests", "/docs", "/Release",
  "/video/src", "/video/*.json", "/video/*.ts", "/video/*.mjs", "/video/README*",
  "/README*", "/CHANGELOG*", "/Install*", "/LICENSE", "/pyproject.toml", "/uv.lock",
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/node_modules/**", "**/.env*"]
