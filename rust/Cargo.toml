[package]
name = "aside-jev-native"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "_aside_jev_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py311"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
