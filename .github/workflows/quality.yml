name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.17"
          python-version: "3.11"
          enable-cache: false
      - name: Build Rust extension with locked Python dependencies
        run: uv sync --frozen --extra dev --extra native
      - name: Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Rust correctness checks
        run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Rust integration and browser regression tests
        env:
          ASIDE_JEV_ENGINE: rust
        run: uv run --frozen --extra dev --extra native pytest -q tests/test_native_core.py tests/test_browser_snapshot_cache.py tests/test_browser_flow.py tests/test_jev.py
      - name: Python compatibility path
        env:
          ASIDE_JEV_ENGINE: python
        run: uv run --frozen --extra dev --extra native pytest -q tests/test_browser_snapshot_cache.py tests/test_browser_flow.py tests/test_jev.py
  static-analysis:
    name: Python lint and validation types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.17"
          python-version: "3.11"
          enable-cache: false
      - name: Install locked project dependencies
        run: uv sync --frozen --extra dev
      # Isolated, version-pinned tools do not change application dependencies.
      - name: Ruff correctness checks
        run: uvx --from ruff==0.13.2 ruff check . --output-format=github
      - name: Pyright validation boundary
        run: uvx --from pyright==1.1.407 pyright
      - name: Pure validation regression tests
        run: uv run --frozen --extra dev pytest -q tests/test_browser_policy.py tests/test_candidate_budget.py
