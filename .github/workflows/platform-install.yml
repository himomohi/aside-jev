name: Platform installation verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      # 공식 저장소의 v4/v7 태그를 GitHub API에서 확인한 전체 커밋으로 고정한다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.17"
          python-version: "3.11"
          enable-cache: false
      - name: Install locked test dependencies
        run: uv sync --frozen --extra dev
      - name: Python regression tests
        run: uv run --frozen --extra dev pytest -q
      - name: JavaScript regression tests
        run: node --test tests/test_extension_controller.mjs tests/test_ui_i18n.mjs tests/test_ui_flow.mjs tests/test_video_i18n.mjs
      - name: Check translated documents
        run: uv run --frozen python scripts/check_i18n.py
      - name: Build wheel
        run: uv build --wheel
      - name: Bootstrap, install, and verify native messaging
        run: uv run --frozen python scripts/verify_installation.py --bootstrap --wheel-dir dist --allow-test-registry
